<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="description" content="A puzzle on the ADS1299 biosignal chip: edit the real firmware registers until the chip's output matches the target. Three setups: EEG, EOG, and EMG." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>ADS1299 register puzzle</title>
  </head>
  <body>
    <div id="stage"></div>
    <header class="topbar">
      <div class="brand">
        <h1>ADS1299</h1>
        <p>Edit the firmware until the output matches the target.</p>
      </div>
      <nav class="tabs" role="tablist" aria-label="Hardware setups"></nav>
      <div class="links">
        <button type="button" class="pins-toggle" aria-pressed="false" title="Pin view (P)">Pins</button>
        <button type="button" class="book-toggle" aria-expanded="false" aria-controls="book" aria-label="Datasheet" title="Datasheet (D)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10.3 5.2 7.9 4.6 4 4.7v13.1c3.9-.1 6.3.5 8 1.8 1.7-1.3 4.1-1.9 8-1.8V4.7c-3.9-.1-6.3.5-8 1.8Z"/><path d="M12 6.5v13.1"/></svg></button>
        <a href="https://github.com/hoeksemaa/voyant" target="_blank" rel="noopener">Source</a>
        <a class="credit" href="https://github.com/hoeksemaa" target="_blank" rel="noopener">made by John</a>
      </div>
    </header>
    <main class="board" id="board"></main>
    <section class="cards" id="cards" aria-label="Channels"></section>
    <section class="dock">
      <div class="dock-panel dock-firmware" id="firmware"></div>
    </section>
    <div class="book" id="book" hidden>
      <div class="book-panel" role="dialog" aria-label="Datasheet" id="datasheet"></div>
    </div>
    <footer class="foot"><a href="https://github.com/hoeksemaa" target="_blank" rel="noopener">made by John</a></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
