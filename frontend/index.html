<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f1e8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="description" content="Can you crack the ADS1299 chip? A three-level puzzle: edit the real firmware registers of a biosignal chip until its output matches the target. EMG, EOG, EEG." />
    <meta property="og:title" content="Can you crack the ADS1299 chip?" />
    <meta property="og:description" content="Three levels: EMG, EOG, EEG. Edit the real firmware registers until the chip's output matches the target." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://voyant-sim.vercel.app/" />
    <meta property="og:image" content="https://voyant-sim.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The 3D model of the TI ADS1299 chip from the game" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://voyant-sim.vercel.app/og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>ADS1299</title>
  </head>
  <body>
    <main class="app">
      <section class="home" id="home" hidden>
        <header class="home-title">
          <h1>Can you crack the ADS1299 chip?</h1>
        </header>
        <div class="home-hero" id="home-hero"></div>
        <div class="brief">
          <h2 class="brief-label" id="level-select">Level select</h2>
        </div>
        <nav class="levels" aria-labelledby="level-select"></nav>
        <footer class="foot">
          <a href="https://github.com/hoeksemaa/voyant" target="_blank" rel="noopener">Source<span class="ext" aria-hidden="true">↗</span></a>
          <span aria-hidden="true">·</span>
          <a href="https://github.com/hoeksemaa" target="_blank" rel="noopener">made by John<span class="ext" aria-hidden="true">↗</span></a>
          <span aria-hidden="true">·</span>
          <button type="button" class="foot-btn" id="reset-levels">Reset Levels</button>
        </footer>
      </section>

      <section class="level" id="level" hidden>
        <nav class="toolbar" aria-label="Level tools">
          <button type="button" data-act="home" title="Home (H)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7"/><path d="M6 9.6V20h12V9.6"/><path d="M10 20v-5.5h4V20"/></svg><span>Home</span></button>
          <button type="button" data-act="overview" title="Overview (O)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 7h10M9.5 12h10M9.5 17h10M4.8 7h.1M4.8 12h.1M4.8 17h.1"/></svg><span>Overview</span></button>
          <button type="button" data-act="pins" title="Pins (P)"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.6"/><path d="M10 3.5V7M14 3.5V7M10 17v3.5M14 17v3.5M3.5 10H7M3.5 14H7M17 10h3.5M17 14h3.5"/></svg><span>Pins</span></button>
          <button type="button" data-act="datasheet" title="Datasheet (D)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h7l4 4v13H7z"/><path d="M14 3.5v4h4M9.6 12h5.8M9.6 15.5h5.8"/></svg><span>Datasheet</span></button>
          <button type="button" data-act="anim" title="Animation (A)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M10.2 8.6 15.6 12l-5.4 3.4z"/></svg><span>Animation</span></button>
          <button type="button" data-act="hint" title="Hint (I)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.2 17.5h5.6M10 20.5h4"/><path d="M12 3.5a6 6 0 0 0-3.7 10.7c.8.7 1.2 1.4 1.2 2.3h5c0-.9.4-1.6 1.2-2.3A6 6 0 0 0 12 3.5z"/></svg><span>Hint</span></button>
          <button type="button" data-act="firmware" class="primary" title="Firmware (F)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 7.5 4 12l4.5 4.5M15.5 7.5 20 12l-4.5 4.5M13.4 5.5l-2.8 13"/></svg><span>Firmware</span></button>
        </nav>
        <header class="lv-head">
          <div class="lv-text">
            <h1><span class="lv-name"></span></h1>
          </div>
          <div class="lv-score"><span class="dots"></span><b class="lv-count"></b></div>
        </header>
        <p class="lv-goal">Edit the <b>firmware</b> until the <b>output signal</b> matches the <b>target signal</b>.</p>
        <div id="flow-host"></div>
        <footer class="foot">
          <a href="https://github.com/hoeksemaa/voyant" target="_blank" rel="noopener">Source<span class="ext" aria-hidden="true">↗</span></a>
          <span aria-hidden="true">·</span>
          <a href="https://github.com/hoeksemaa" target="_blank" rel="noopener">made by John<span class="ext" aria-hidden="true">↗</span></a>
        </footer>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
